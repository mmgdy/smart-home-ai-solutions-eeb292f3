name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-functions.yml'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN }}
          PROJECT_REF: djsibxhkfvwtjzvnjmhp
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing Supabase access token. Add a repository secret named SUPABASE_ACCESS_TOKEN (or SUPABASE_TOKEN)."
            exit 1
          fi
          for sql_file in supabase/migrations/20261124_add_product_description_ar.sql supabase/migrations/20261125_xpay_payment_secrets.sql supabase/migrations/20261125_categories_management.sql supabase/migrations/20261126_sync_hidden_products_is_published.sql; do
            if [ -f "$sql_file" ]; then
              echo "==> Applying $sql_file"
              payload=$(python3 -c 'import json,sys; print(json.dumps({"query": open(sys.argv[1], "r", encoding="utf-8").read()}))' "$sql_file")
              curl -fsS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$payload"
              echo ""
            fi
          done

      - name: Remove deprecated paysky-checkout edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN }}
          PROJECT_REF: djsibxhkfvwtjzvnjmhp
        run: |
          supabase functions delete paysky-checkout --project-ref "$PROJECT_REF" --yes || true

      - name: Deploy each edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN }}
          PROJECT_REF: djsibxhkfvwtjzvnjmhp
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing Supabase access token. Add a repository secret named SUPABASE_ACCESS_TOKEN (or SUPABASE_TOKEN)."
            exit 1
          fi
          # Deploy every function; a single broken function must not block the
          # rest (one failing bundle used to silently freeze all functions
          # later in the alphabet at their stale versions).
          FAILED=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            # Skip shared/private helper folders (start with _)
            case "$name" in _*) echo "Skipping $name"; continue;; esac
            echo "==> Deploying $name"
            if ! supabase functions deploy "$name" \
              --project-ref "$PROJECT_REF" \
              --no-verify-jwt \
              --use-api \
              --yes; then
              echo "::warning::$name failed to deploy — continuing with the rest."
              FAILED="$FAILED $name"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Failed to deploy:$FAILED"
            exit 1
          fi
