name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-functions.yml'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply add_product_description_ar migration via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN }}
          PROJECT_REF: djsibxhkfvwtjzvnjmhp
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"query":"ALTER TABLE public.products ADD COLUMN IF NOT EXISTS description_ar TEXT; NOTIFY pgrst, '\''reload schema'\'';"}' || true
          fi

      - name: Deploy each edge function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN }}
          PROJECT_REF: djsibxhkfvwtjzvnjmhp
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing Supabase access token. Add a repository secret named SUPABASE_ACCESS_TOKEN (or SUPABASE_TOKEN)."
            exit 1
          fi
          # Deploy every function; a single broken function must not block the
          # rest (one failing bundle used to silently freeze all functions
          # later in the alphabet at their stale versions).
          FAILED=""
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            # Skip shared/private helper folders (start with _)
            case "$name" in _*) echo "Skipping $name"; continue;; esac
            echo "==> Deploying $name"
            if ! supabase functions deploy "$name" \
              --project-ref "$PROJECT_REF" \
              --no-verify-jwt; then
              echo "::warning::$name failed to deploy — continuing with the rest."
              FAILED="$FAILED $name"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Failed to deploy:$FAILED"
            exit 1
          fi
